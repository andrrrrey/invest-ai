                                    </div>
                                </template>
                            </div>
                        </template>

                        <!-- Spreadsheet table -->
                        <div style="overflow-x:auto;margin-bottom:14px;border:1.5px solid #E5E5ED;border-radius:12px">
                            <table style="border-collapse:collapse;font-size:12px;min-width:max-content;width:100%">
                                <thead>
                                    <tr style="background:#F8F7F3">
                                        <th style="position:sticky;left:0;z-index:2;background:#F8F7F3;padding:8px 14px;text-align:left;font-weight:700;color:#8E8E93;border-bottom:2px solid #E5E5ED;white-space:nowrap;min-width:160px">
                                            Метрика
                                        </th>
                                        <template x-for="p in periods" :key="periodKey(p)">
                                            <th style="padding:8px 6px;text-align:center;font-weight:700;color:#8E8E93;border-bottom:2px solid #E5E5ED;white-space:nowrap;min-width:90px"
                                                x-text="formatPeriodLabel(p)"></th>
                                        </template>
                                    </tr>
                                </thead>
                                <!-- one <tbody> per metric — Alpine x-for renders <tbody> as direct table child -->
                                <template x-for="metric in metricNames" :key="metric">
                                    <tbody>
                                        <!-- Plan row -->
                                        <tr>
                                            <td style="position:sticky;left:0;z-index:1;padding:5px 14px;font-weight:600;border-bottom:1px solid #F0F0F8;white-space:nowrap;font-size:11px"
                                                :style="isRevenue(metric) ? 'background:#EAF4FF;color:#0A84FF' : 'background:#F8F8FF;color:#5E5CE6'">
                                                <span x-text="metric"></span>
                                                <span style="font-size:9px;font-weight:400;color:#8E8E93;margin-left:4px;text-transform:uppercase;letter-spacing:0.4px">план</span>
                                            </td>
                                            <template x-for="p in periods" :key="periodKey(p)">
                                                <td style="padding:4px;border-bottom:1px solid #F0F0F8"
                                                    :style="isRevenue(metric) ? 'background:#EAF4FF' : 'background:#F8F8FF'">
                                                    <span style="display:block;width:82px;padding:4px 6px;font-size:12px;text-align:right;color:#333"
                                                        x-text="fmtNum(getPlan(metric, p)) || '—'"></span>
                                                </td>
                                            </template>
                                        </tr>
                                        <!-- Fact row -->
                                        <tr>
                                            <td style="position:sticky;left:0;z-index:1;background:white;padding:5px 14px;font-weight:600;border-bottom:1px solid #EAFAF0;white-space:nowrap;font-size:11px"
                                                :style="isRevenue(metric) ? 'color:#0A84FF' : 'color:#2D9B63'">
                                                <span x-text="metric"></span>
                                                <span style="font-size:9px;font-weight:400;color:#8E8E93;margin-left:4px;text-transform:uppercase;letter-spacing:0.4px">факт</span>
                                            </td>
                                            <template x-for="p in periods" :key="periodKey(p)">
                                                <td style="padding:4px;border-bottom:1px solid #EAFAF0;background:white">
                                                    <input type="text" inputmode="decimal"
                                                        :value="fmtNum(getFact(metric, p))"
                                                        @change="setFact(metric, p, parseNum($event.target.value))"
                                                        :style="isRevenue(metric) ? 'width:82px;padding:4px 6px;border:1.5px solid #BDD9F2;border-radius:6px;font-size:12px;text-align:right;background:white;color:#0A84FF;font-weight:600;outline:none' : 'width:82px;padding:4px 6px;border:1.5px solid #D0EDD9;border-radius:6px;font-size:12px;text-align:right;background:white;color:#2D9B63;font-weight:600;outline:none'"
                                                        placeholder="—">
                                                </td>
                                            </template>
                                        </tr>
                                        <!-- Deviation row -->
                                        <tr>
                                            <td style="position:sticky;left:0;z-index:1;background:#FAFAF8;padding:3px 14px;font-size:10px;color:#8E8E93;border-bottom:2px solid #E5E5ED;letter-spacing:0.3px">
                                                ОТКЛ. %
                                            </td>
                                            <template x-for="p in periods" :key="periodKey(p)">
                                                <td style="padding:3px 4px;text-align:center;font-size:10px;font-weight:700;border-bottom:2px solid #E5E5ED;background:#FAFAF8"
                                                    :style="deviationColor(metric, p)"
                                                    x-text="getDeviation(metric,p) !== null ? (getDeviation(metric,p) > 0 ? '+' : '') + getDeviation(metric,p) + '%' : '—'">
                                                </td>
                                            </template>
                                        </tr>
                                    </tbody>
                                </template>
                            </table>
                        </div>

                        <!-- Save button -->
                        <div style="display:flex;justify-content:flex-end;margin-bottom:16px">
                            <button @click="saveFact()" :disabled="factSaving"
                                style="background:var(--accent-purple);color:white;border:none;border-radius:12px;padding:8px 24px;font-size:13px;font-weight:600;cursor:pointer">
                                <i class="fas" :class="factSaving ? 'fa-spinner fa-spin' : 'fa-save'"></i>
                                <span x-text="factSaving ? 'Сохраняем...' : 'Сохранить'"></span>
                            </button>
                        </div>

                        <!-- Chart canvas -->
                        <div x-show="hasData" style="background:white;border-radius:14px;padding:16px 20px;border:1.5px solid #E5E5ED">
                            <canvas x-ref="factChart" style="max-height:300px"></canvas>
                        </div>
                        </div>
                    </section>

                    </div><!-- /activeTab fact -->

                </div>
            </template>

            <!-- Confirm dialog -->
            <div x-show="confirmModal.show"
                 style="position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px">
                <div style="background:white;border-radius:20px;padding:28px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.25)">
                    <h3 style="font-size:17px;font-weight:700;margin-bottom:10px" x-text="confirmModal.title"></h3>
                    <p style="font-size:13px;color:#8E8E93;margin-bottom:24px;line-height:1.55" x-text="confirmModal.message"></p>
                    <div style="display:flex;gap:10px;justify-content:flex-end">
                        <button @click="confirmModal.show=false"
                            style="padding:10px 20px;border-radius:12px;border:1.5px solid #E5E5E5;background:white;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit">
                            Отмена
                        </button>
                        <button @click="doConfirm()"
                            :style="confirmModal.danger
                                ? 'padding:10px 20px;border-radius:12px;border:none;background:#FF3B30;color:white;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit'
                                : 'padding:10px 20px;border-radius:12px;border:none;background:#5E5CE6;color:white;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit'"
                            x-text="confirmModal.confirmLabel">

                    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/finance.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
    <script src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js" defer></script>
    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
        }

        document.addEventListener('DOMContentLoaded', function() {
            patchSidebar();
            if (getUserRole() === 'cfo') {
                const nu = document.getElementById('nav-users');
                if (nu) nu.style.display = '';
            }
            if (getUserRole() !== 'cfo') {
                const ns = document.getElementById('nav-settings');
                if (ns) ns.style.display = 'none';
            }
            if (getUserRole() === 'owner') {
                const ne = document.getElementById('nav-export');
                if (ne) ne.style.display = 'none';
            }
        });

        function projectDetailApp() {
            return {
                ...authMixin(),
                project: null,
                loading: true,
                recalculating: false,
                aiAnalysis: null,
                aiLoading: false,
                statusMsg: '',
                statusMsgType: 'ok',
                activeTab: 'main',
                showExtraTimeModal: false,
                confirmModal: { show: false, title: '', message: '', confirmLabel: 'Подтвердить', danger: false, onConfirm: null },
                showConfirm(title, message, onConfirm, opts = {}) {
                    this.confirmModal = { show: true, title, message, confirmLabel: opts.confirmLabel || 'Подтвердить', danger: opts.danger || false, onConfirm };
                },
                doConfirm() {
                    if (this.confirmModal.onConfirm) this.confirmModal.onConfirm();
                    this.confirmModal.show = false;
                },
                extraTime: { hoursPerMonth: 0, hourCost: 0, cycleDays: 0, months: 12, comment: '' },
                customMetrics: [],
                showAddMetric: false,
                newMetric: { name: '', value: '' },

                addCustomMetric() {
                    if (!this.newMetric.name.trim()) return;
                    this.customMetrics.push({ id: Date.now(), name: this.newMetric.name, value: this.newMetric.value });
                    this.newMetric = { name: '', value: '' };
                    this.showAddMetric = false;
                },

                async init() {
                    if (!redirectIfNotLoggedIn()) return;
                    const id = new URLSearchParams(location.search).get('id');
                    if (!id) { this.loading = false; return; }
                    try {
                        const res = await authFetch('/api/v1/projects/' + id);
                        if (res.ok) this.project = await res.json();
                    } catch(e) {
                        if (e.message !== 'Unauthorized') console.error(e);
                    } finally {
                        this.loading = false;
                    }
                },

                get fm() {
                    return this.project?.financial_model || {};
                },

                get metrics() {
                    // Prefer backend-cached metrics (authoritative, computed by Python/numpy)
                    if (this.project?.metrics && Object.keys(this.project.metrics).length > 0) {
                        return this.project.metrics;
                    }
                    // Fallback: recalculate on the client if backend metrics are absent
                    const fm = this.project?.financial_model;
                    if (fm && typeof Finance !== 'undefined') {
                        try { return Finance.calculate(fm); } catch(_) {}
                    }
                    return {};
                },

                renderRichText(content) {
                    if (!content) return '';
                    if (/<[a-z][\s\S]*>/i.test(content)) return content;
                    return content.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>');
                },

                get statusLabel() {
                    const map = { draft: 'Черновик', pending_approval: 'На согласовании', approved: 'Утверждён', rejected: 'Отклонён' };
                    return map[this.project?.status] || this.project?.status || '—';
                },

                get statusBadgeStyle() {
                    const s = this.project?.status;
                    if (s === 'approved') return 'background:#DDF0E1;color:#2D9B63';
                    if (s === 'rejected') return 'background:#FFE5E5;color:#EB5757';
                    if (s === 'pending_approval') return 'background:#FFF4E5;color:#FF9500';
                    return 'background:#F0F0F0;color:#8E8E93';
                },

                get badgeStyle() {
                    const s = this.project?.status;
                    if (s === 'approved') return 'background:#DDF0E1;color:#2D9B63';
                    if (s === 'rejected') return 'background:#FFE5E5;color:#EB5757';
                    if (s === 'pending_approval') return 'background:#FFF4E5;color:#FF9500';
                    return 'background:#F0F0F0;color:#8E8E93';
                },

                get badgeIcon() {
                    const s = this.project?.status;
                    if (s === 'approved') return 'fas fa-check-circle';
                    if (s === 'rejected') return 'fas fa-times-circle';
                    if (s === 'pending_approval') return 'fas fa-clock';
                    return 'fas fa-edit';
                },

                routeLabel(route) {
                    const map = { fast_track: 'Fast Track ✅', efficiency_play: 'Efficiency Play 🟡', backlog_stop: 'Backlog / Stop 🔴', manual_review: 'Ручной разбор 🔍' };
                    return route ? (map[route] || route) : '—';
                },

                fmtMoney(v) {
                    if (v == null || isNaN(v)) return '—';
                    const sign = v < 0 ? '-' : '';
                    const abs = Math.abs(v);
                    if (abs >= 1e9) return sign + (abs/1e9).toFixed(2) + ' млрд ₽';
                    if (abs >= 1e6) return sign + (abs/1e6).toFixed(2) + ' млн ₽';
                    if (abs >= 1e3) return sign + Math.round(abs/1e3) + ' тыс ₽';
                    return sign + Math.round(abs) + ' ₽';
                },

                fmtDate(iso) {
                    if (!iso) return '—';
                    return new Date(iso).toLocaleDateString('ru-RU', { day:'numeric', month:'long', year:'numeric' });
                },

                async runAiAnalysis() {
                    if (!this.project) return;
                    this.aiLoading = true;
                    try {
                        const plainProject = JSON.parse(JSON.stringify(this.project));
                        const plainMetrics = JSON.parse(JSON.stringify(this.metrics));
                        const res = await authFetch('/api/v1/ai/analyze', {
                            method: 'POST',
                            body: JSON.stringify({ project: plainProject, metrics: plainMetrics }),
                        });
                        if (res.ok) {
                            this.aiAnalysis = await res.json();
                        } else {
                            const err = await res.json().catch(() => ({}));
                            this.aiAnalysis = { comment: err.detail || 'AI недоступен', anomalies: [], comparison: '' };
                        }
                    } catch(e) {
                        if (e.message !== 'Unauthorized') {
                            console.error('AI analysis error:', e);
                            this.aiAnalysis = { comment: 'Ошибка соединения', anomalies: [], comparison: '' };
                        }
                    } finally {
                        this.aiLoading = false;
                    }
                },

                async changeStatus(newStatus) {
                    try {
                        const res = await authFetch('/api/v1/projects/' + this.project.id + '/status', {
                            method: 'PATCH',
                            body: JSON.stringify({ status: newStatus }),
                        });
                        if (res.ok) {
                            this.project = await res.json();
                            this.statusMsg = 'Статус обновлён';
                            this.statusMsgType = 'ok';
                        } else {
                            const err = await res.json().catch(() => ({}));
                            this.statusMsg = err.detail || 'Ошибка обновления статуса';
                            this.statusMsgType = 'err';
                        }
                    } catch(e) {
                        if (e.message !== 'Unauthorized') {
                            this.statusMsg = 'Ошибка соединения';
                            this.statusMsgType = 'err';
                        }
                    }
                    setTimeout(() => { this.statusMsg = ''; }, 3000);
                },

                async recalculateMetrics() {
                    if (!this.project || this.recalculating) return;
                    this.recalculating = true;
                    try {
                        const res = await authFetch('/api/v1/projects/' + this.project.id + '/recalculate', { method: 'PATCH' });
                        if (res.ok) {
                            this.project = await res.json();
                            this.statusMsg = 'Метрики пересчитаны';
                            this.statusMsgType = 'ok';
                        } else {
                            const err = await res.json().catch(() => ({}));
                            this.statusMsg = 'Ошибка: ' + (err.detail || res.status);
                            this.statusMsgType = 'error';
                        }
                    } catch(e) {
                        this.statusMsg = 'Ошибка соединения: ' + e.message;
                        this.statusMsgType = 'error';
                    } finally {
                        this.recalculating = false;
                        setTimeout(() => { this.statusMsg = ''; }, 3000);
                    }
                },

                deleteProject() {
                    if (!this.project) return;
                    this.showConfirm(
                        'Удалить проект?',
                        `Проект «${this.project.name || 'без названия'}» будет удалён безвозвратно. Это действие нельзя отменить.`,
                        async () => {
                            try {
                                const res = await authFetch('/api/v1/projects/' + this.project.id, { method: 'DELETE' });
                                if (res.ok || res.status === 204) {
                                    window.location.href = '/project-list';
                                } else {
                                    alert('Ошибка удаления проекта');
                                }
                            } catch(e) {
                                alert('Ошибка соединения: ' + e.message);
                            }
                        },
                        { danger: true, confirmLabel: 'Удалить' }
                    );
                },

                async copyProject() {
                    if (!this.project) return;
                    if (!confirm(`Создать копию проекта «${this.project.name || 'без названия'}»?`)) return;
                    try {
                        const res = await authFetch('/api/v1/projects/' + this.project.id + '/copy', { method: 'POST' });
                        if (res.ok) {
                            const copy = await res.json();
                            window.location.href = '/project?id=' + copy.id;
                        } else {
                            const err = await res.json().catch(() => ({}));
                            alert(err.detail || 'Ошибка копирования проекта');
                        }
                    } catch(e) {
                        alert('Ошибка соединения: ' + e.message);
                    }
                },
            };
        }

        // ── Shared helpers ─────────────────────────────────────────────────
        function _projectId() {
            return new URLSearchParams(location.search).get('id');
        }
        function _fmtMoney(v) {
            if (v == null || isNaN(v)) return '—';
            const s = v < 0 ? '-' : '', a = Math.abs(v);
            if (a >= 1e9) return s + (a/1e9).toFixed(2) + ' млрд ₽';
            if (a >= 1e6) return s + (a/1e6).toFixed(2) + ' млн ₽';
            if (a >= 1e3) return s + Math.round(a/1e3) + ' тыс ₽';
            return s + Math.round(a) + ' ₽';
        }
        function _fmtDateShort(iso) {
            if (!iso) return '—';
            return new Date(iso).toLocaleDateString('ru-RU', {day:'numeric', month:'short', year:'numeric'});
        }

        // ── Bell notifications ─────────────────────────────────────────────
        function bellApp() {
            return {
                open: false,
                popupTop: 0,
                popupRight: 0,
                notifications: [],
                unreadCount: 0,
                async initBell() {
                    await this.loadNotifications();
                    setInterval(() => this.loadNotifications(), 30000);
                },
                async loadNotifications() {
                    try {
                        const res = await authFetch('/api/v1/notifications');
                        if (res.ok) {
                            this.notifications = await res.json();
                            this.unreadCount = this.notifications.filter(n => !n.is_read).length;
                        }
                    } catch(e) {}
                },
                toggleBell() {
                    this.open = !this.open;
                    if (this.open) {
                        const btn = this.$el.querySelector('button');
                        const r = btn.getBoundingClientRect();
                        this.popupTop = r.bottom + 8;
                        this.popupRight = window.innerWidth - r.right;
                    }
                },
                async markAllRead() {
                    await authFetch('/api/v1/notifications/read-all', {method:'PATCH'});
                    this.notifications.forEach(n => n.is_read = true);
                    this.unreadCount = 0;
                },
                async openNotification(n) {
                    if (!n.is_read) {
                        await authFetch(`/api/v1/notifications/${n.id}/read`, {method:'PATCH'});
                        n.is_read = true;
                        this.unreadCount = Math.max(0, this.unreadCount - 1);
                    }
                    this.open = false;
                    if (n.link) window.location.href = n.link;
                },
                fmtBellDate(iso) {
                    if (!iso) return '';
                    return new Date(iso).toLocaleDateString('ru-RU', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
                },
            };
        }

        // ── Comments ───────────────────────────────────────────────────────
        function commentsApp() {
            return {
                comments: [],
                commentText: '',
                submittingComment: false,
                async loadComments() {
                    const id = _projectId();
                    if (!id) return;
                    try {
                        const res = await authFetch('/api/v1/projects/' + id + '/comments');
                        if (res.ok) this.comments = await res.json();
                    } catch(e) {}
                },
                async submitComment() {
                    if (!this.commentText.trim()) return;
                    this.submittingComment = true;
                    try {
                        const res = await authFetch('/api/v1/projects/' + _projectId() + '/comments', {
                            method: 'POST',
                            body: JSON.stringify({text: this.commentText.trim()}),
                        });
                        if (res.ok) {
                            const c = await res.json();
                            this.comments.unshift(c);
                            this.commentText = '';
                        }
                    } catch(e) {} finally { this.submittingComment = false; }
                },
                fmtDateShort: _fmtDateShort,
            };
        }

        // ── Attachments ────────────────────────────────────────────────────
        function attachmentsApp() {
            return {
                attachments: [],
                uploading: false,
                async loadAttachments() {
                    const id = _projectId();
                    if (!id) return;
                    try {
                        const res = await authFetch('/api/v1/projects/' + id + '/attachments');
                        if (res.ok) this.attachments = await res.json();
                    } catch(e) {}
                },
                async uploadFile(event) {
                    const file = event.target.files[0];
                    if (!file) return;
                    this.uploading = true;
                    const fd = new FormData();
                    fd.append('file', file);
                    try {
                        const res = await fetch('/api/v1/projects/' + _projectId() + '/attachments', {
                            method: 'POST',
                            headers: {Authorization: 'Bearer ' + localStorage.getItem('invest_token')},
                            body: fd,
                        });
                        if (res.ok) {
                            const a = await res.json();
                            this.attachments.unshift(a);
                        } else {
                            const err = await res.json().catch(() => ({}));
                            alert(err.detail || 'Ошибка загрузки файла');
                        }
                    } catch(e) { alert('Ошибка: ' + e.message); }
                    finally { this.uploading = false; event.target.value = ''; }
                },
                async downloadFile(a) {
                    try {
                        const res = await authFetch('/api/v1/attachments/' + a.id + '/download');
                        if (!res.ok) { alert('Ошибка скачивания'); return; }
                        const blob = await res.blob();
                        const url = URL.createObjectURL(blob);
                        const link = document.createElement('a');
                        link.href = url; link.download = a.original_name;
                        document.body.appendChild(link); link.click();
                        document.body.removeChild(link);
                        setTimeout(() => URL.revokeObjectURL(url), 1000);
                    } catch(e) { alert('Ошибка: ' + e.message); }
                },
                fmtFileSize(bytes) {
                    if (bytes >= 1048576) return (bytes/1048576).toFixed(1) + ' МБ';
                    if (bytes >= 1024) return Math.round(bytes/1024) + ' КБ';
                    return bytes + ' Б';
                },
                fmtDateShort: _fmtDateShort,
            };
        }

        // ── Tranches ───────────────────────────────────────────────────────
        function tranchesApp() {
            return {
                tranches: [],
                showAddTranche: false,
                newTranche: {amount: 0, planned_date: '', description: ''},
                async loadTranches() {
                    const id = _projectId();
                    if (!id) return;
                    try {
                        const res = await authFetch('/api/v1/projects/' + id + '/tranches');
                        if (res.ok) this.tranches = await res.json();
                    } catch(e) {}
                },
                get approvedTotal() {
                    return this.tranches.filter(t => t.status === 'approved')
                        .reduce((s, t) => s + t.amount, 0);
                },
                get requestedTotal() {
                    return this.tranches.filter(t => t.status === 'requested')
                        .reduce((s, t) => s + t.amount, 0);
                },
                async addTranche() {
                    if (!this.newTranche.amount) return;
                    const payload = {
                        ...this.newTranche,
                        order_index: this.tranches.length,
                    };
                    try {
                        const res = await authFetch('/api/v1/projects/' + _projectId() + '/tranches', {
                            method: 'POST', body: JSON.stringify(payload),
                        });
                        if (res.ok) {
                            this.tranches.push(await res.json());
                            this.newTranche = {amount: 0, planned_date: '', description: ''};
                            this.showAddTranche = false;
                        }
                    } catch(e) { alert('Ошибка: ' + e.message); }
                },
                async approveNextTranche(t, items) {
                    if (items.length > 0 && !items.every(i => i.is_met)) {
                        alert('Не все триггеры выполнены'); return;
                    }
                    try {
                        const res = await authFetch('/api/v1/tranches/' + t.id + '/status', {
                            method: 'PATCH', body: JSON.stringify({status: 'approved'}),
                        });
                        if (res.ok) {
                            const updated = await res.json();
                            const idx = this.tranches.findIndex(x => x.id === t.id);
                            if (idx >= 0) this.tranches[idx] = updated;
                        } else {
                            const e = await res.json().catch(()=>({}));
                            alert(e.detail || 'Ошибка');
                        }
                    } catch(e) { alert('Ошибка: ' + e.message); }
                },
                async payTranche(t) {
                    try {
                        const res = await authFetch('/api/v1/tranches/' + t.id + '/status', {
                            method: 'PATCH', body: JSON.stringify({status: 'paid'}),
                        });
                        if (res.ok) {
                            const updated = await res.json();
                            const idx = this.tranches.findIndex(x => x.id === t.id);
                            if (idx >= 0) this.tranches[idx] = updated;
                        }
                    } catch(e) { alert('Ошибка: ' + e.message); }
                },
                async deleteTranche(t) {
                    if (!confirm('Удалить транш? Это действие нельзя отменить.')) return;
                    try {
                        const res = await authFetch('/api/v1/tranches/' + t.id, { method: 'DELETE' });
                        if (res.ok || res.status === 204) {
                            this.tranches = this.tranches.filter(x => x.id !== t.id);
                        } else {
                            const e = await res.json().catch(()=>({}));
                            alert(e.detail || 'Ошибка удаления');
                        }
                    } catch(e) { alert('Ошибка: ' + e.message); }
                },
                isCfoOrManager() {
                    const r = getUserRole();
                    return r === 'cfo' || r === 'manager';
                },
                fmtMoney: _fmtMoney,
            };
        }

        // ── Checklist (nested inside each tranche) ─────────────────────────
        function checklistApp(trancheId) {
            return {
                trancheId,
                items: [],
                async loadChecklist() {
                    try {
                        const res = await authFetch('/api/v1/tranches/' + this.trancheId + '/triggers');
                        if (res.ok) this.items = await res.json();
                    } catch(e) {}
                },
                allMet(items) { return items.every(i => i.is_met); },
                async toggleItem(ci) {
                    ci.is_met = !ci.is_met;
                    try {
                        await authFetch('/api/v1/tranches/' + this.trancheId + '/triggers', {
                            method: 'PUT',
                            body: JSON.stringify(this.items),
                        });
                    } catch(e) { ci.is_met = !ci.is_met; }
                },
                isCfoOrManager() {
                    const r = getUserRole();
                    return r === 'cfo' || r === 'manager';
                },
            };
        }

        // ── Plan vs Fact ───────────────────────────────────────────────────
        function factApp() {
            return {
                metricNames: [],
                periods: [],          // [{year, month}]
                _gridPlan: {},        // "metric||year/mm" -> number|null
                _gridFact: {},
                newMetricName: '',
                factDirty: false,
                factSaving: false,
                factLoading: false,
                factAiLoading: false,
                factAiData: null,
                _chart: null,

                periodKey(p) { return p.year + '/' + String(p.month).padStart(2, '0'); },
                _cellKey(metric, p) { return metric + '||' + this.periodKey(p); },
                formatPeriodLabel(p) {
                    const M = ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
                    return M[p.month - 1] + ' ' + p.year;
                },

                initPeriods(startYear, startMonth, count) {
                    this.periods = [];
                    let y = startYear, m = startMonth;
                    for (let i = 0; i < count; i++) {
                        this.periods.push({year: y, month: m});
                        m++;
                        if (m > 12) { m = 1; y++; }
                    }
                },
                extendPeriods() {
                    const last = this.periods[this.periods.length - 1] || {year: new Date().getFullYear(), month: 12};
                    let y = last.year, m = last.month + 1;
                    if (m > 12) { m = 1; y++; }
                    for (let i = 0; i < 12; i++) {
                        this.periods.push({year: y, month: m});
                        m++;
                        if (m > 12) { m = 1; y++; }
                    }
                },

                getPlan(metric, p) { return this._gridPlan[this._cellKey(metric, p)] ?? null; },
                getFact(metric, p) { return this._gridFact[this._cellKey(metric, p)] ?? null; },
                fmtNum(v) { if (v == null || v === '') return ''; return Number(v).toLocaleString('ru-RU'); },
                parseNum(s) { if (!s && s !== 0) return null; const n = parseFloat(String(s).replace(/\s/g, '').replace(',', '.')); return isNaN(n) ? null : n; },
                setPlan(metric, p, val) {
                    const k = this._cellKey(metric, p);
                    const v = val === '' || val === null ? null : parseFloat(val);
                    this._gridPlan = {...this._gridPlan, [k]: (isNaN(v) ? null : v)};
                    this.factDirty = true;
                    this.$nextTick(() => this._renderChart());
                },
                setFact(metric, p, val) {
                    const k = this._cellKey(metric, p);
                    const v = val === '' || val === null ? null : parseFloat(val);
                    this._gridFact = {...this._gridFact, [k]: (isNaN(v) ? null : v)};
                    this.factDirty = true;
                    this.$nextTick(() => this._renderChart());
                },
                isRevenue(metric) { return metric === 'Выручка'; },

                getDeviation(metric, p) {
                    const plan = this.getPlan(metric, p);
                    const fact = this.getFact(metric, p);
                    if (plan == null || fact == null || plan === 0) return null;
                    return Math.round((fact - plan) / plan * 100 * 10) / 10;
                },

                deviationColor(metric, p) {
                    const dev = this.getDeviation(metric, p);
                    if (dev === null) return 'color:#C7C7CC';
                    if (dev === 0) return 'color:#C7C7CC';
                    // Revenue: exceeding plan is good (green); costs: underspending is good (green)
                    const good = this.isRevenue(metric) ? dev > 0 : dev < 0;
                    return good ? 'color:#2D9B63' : 'color:#FF3B30';
                },

                addMetric() {
                    const name = this.newMetricName.trim();
                    if (!name || this.metricNames.includes(name)) return;
                    this.metricNames = [...this.metricNames, name];
                    this.newMetricName = '';
                    this.factDirty = true;
                },

                get hasData() {
                    return Object.values(this._gridPlan).some(v => v !== null) ||
                           Object.values(this._gridFact).some(v => v !== null);
                },

                async loadFact() {
                    const id = _projectId();
                    if (!id) return;
                    this.factLoading = true;
                    const now = new Date();
                    this.initPeriods(now.getFullYear(), 1, 12);
                    try {
                        // Always fetch project first to get categories from financial model
                        const projRes = await authFetch('/api/v1/projects/' + id);
                        if (projRes.ok) {
                            const proj = await projRes.json();
                            const fm = proj.financial_model || {};
                            let categories = [];
                            if (proj.project_type === 'investment') {
                                categories = (fm.costs || []).map(c => c.category).filter(Boolean);
                                if (categories.length) {
                                    const startYear = proj.start_date ? parseInt(proj.start_date.slice(0,4)) : now.getFullYear();
                                    const numYears = fm.numYears || 1;
                                    const numMonths = Math.max(12, numYears * 12);
                                    this.initPeriods(startYear, 1, numMonths);
                                    const m = proj.metrics || {};
                                    const annualRevenue = m.annualRevenue || [];
                                    const newPaidUsers = m.newPaidUsers || [];
                                    // First pass: compute non-percent_costs categories
                                    const annualCostsByCat = {};
                                    (fm.costs || []).forEach(row => {
                                        if (!row.category || row.mode === 'percent_costs') return;
                                        const vals = [];
                                        for (let yi = 0; yi < numYears; yi++) {
                                            let v = 0;
                                            if (row.mode === 'manual') {
                                                v = (row.values || [])[yi] || 0;
                                            } else if (row.mode === 'percent_revenue') {
                                                v = (annualRevenue[yi] || 0) * ((row.param || 0) / 100);
                                            } else if (row.mode === 'cac') {
                                                const u = (newPaidUsers[yi] || []).reduce((a, b) => a + b, 0);
                                                v = u * (row.param || 0);
                                            }
                                            vals.push(v);
                                        }
                                        annualCostsByCat[row.category] = vals;
                                    });
                                    // Second pass: percent_costs categories
                                    (fm.costs || []).forEach(row => {
                                        if (!row.category || row.mode !== 'percent_costs') return;
                                        const vals = [];
                                        for (let yi = 0; yi < numYears; yi++) {
                                            const devTotal = Object.entries(annualCostsByCat)
                                                .filter(([k]) => {
                                                    const kl = k.toLowerCase();
                                                    return k !== row.category
                                                        && !kl.includes('маркетинг') && !kl.includes('marketing')
                                                        && !kl.includes('support') && !kl.includes('поддержк');
                                                })
                                                .reduce((s, [, v]) => s + Math.abs(v[yi] || 0), 0);
                                            vals.push(devTotal * ((row.param || 0) / 100));
                                        }
                                        annualCostsByCat[row.category] = vals;
                                    });
                                    // Populate _gridPlan with monthly values
                                    const newPlan = {};
                                    const pad2 = n => String(n).padStart(2, '0');
                                    (fm.costs || []).forEach(row => {
                                        if (!row.category) return;
                                        for (let yi = 0; yi < numYears; yi++) {
                                            const yr = startYear + yi;
                                            // For manual mode: use monthlyValues directly if available,
                                            // otherwise distribute annual value evenly
                                            if (row.mode === 'manual') {
                                                const mv = (row.monthlyValues || [])[yi];
                                                if (mv && mv.length === 12) {
                                                    for (let mi = 0; mi < 12; mi++) {
                                                        const v = mv[mi] || 0;
                                                        if (v) newPlan[row.category + '||' + yr + '/' + pad2(mi + 1)] = v;
                                                    }
                                                } else {
                                                    const annual = (row.values || [])[yi] || 0;
                                                    if (annual) {
                                                        const perMonth = annual / 12;
                                                        for (let mi = 0; mi < 12; mi++) {
                                                            newPlan[row.category + '||' + yr + '/' + pad2(mi + 1)] = perMonth;
                                                        }
                                                    }
                                                }
                                            } else {
                                                const annVals = annualCostsByCat[row.category] || [];
                                                const annual = annVals[yi] || 0;
                                                if (annual) {
                                                    const perMonth = annual / 12;
                                                    for (let mi = 0; mi < 12; mi++) {
                                                        newPlan[row.category + '||' + yr + '/' + pad2(mi + 1)] = perMonth;
                                                    }
                                                }
                                            }
                                        }
                                    });
                                    // Prepend revenue plan from financial model metrics
                                    if (annualRevenue.length) {
                                        for (let yi = 0; yi < numYears; yi++) {
                                            const yr = startYear + yi;
                                            const annual = annualRevenue[yi] || 0;
                                            if (annual) {
                                                const perMonth = annual / 12;
                                                for (let mi = 0; mi < 12; mi++) {
                                                    newPlan['Выручка||' + yr + '/' + pad2(mi + 1)] = perMonth;
                                                }
                                            }
                                        }
                                        categories = ['Выручка', ...categories];
                                    }
                                    this._gridPlan = newPlan;
                                }
                            } else {
                                categories = (fm.op_budget_rows || []).map(r => r.category).filter(Boolean);
                                if (categories.length) {
                                    const startYear = proj.start_date ? parseInt(proj.start_date.slice(0,4)) : now.getFullYear();
                                    const numYears = fm.op_budget_numYears || 1;
                                    this.initPeriods(startYear, 1, numYears * 12);
                                    const newPlan = {};
                                    (fm.op_budget_rows || []).forEach(row => {
                                        if (!row.category) return;
                                        (row.monthlyValues || []).forEach((yearVals, yi) => {
                                            (yearVals || []).forEach((val, mi) => {
                                                if (val) {
                                                    newPlan[this._cellKey(row.category, {year: startYear + yi, month: mi + 1})] = val;
                                                }
                                            });
                                        });
                                    });
                                    this._gridPlan = newPlan;
                                }
                            }
                            if (categories.length) this.metricNames = categories;
                        }
                        // Overlay saved entries on top of pre-populated values
                        const res = await authFetch('/api/v1/projects/' + id + '/fact');
                        if (res.ok) {
                            const entries = await res.json();
                            if (entries.length) {
                                const years = entries.map(e => e.year);
                                const minYear = Math.min(...years);
                                const maxYear = Math.max(...years);
                                const maxMonth = Math.max(...entries.filter(e => e.year === maxYear).map(e => e.month));
                                let total = (maxYear - minYear) * 12 + maxMonth;
                                total = Math.max(12, Math.ceil(total / 12) * 12);
                                this.initPeriods(minYear, 1, total);

                                const savedMetrics = [];
                                for (const e of entries) {
                                    if (!savedMetrics.includes(e.metric_name)) savedMetrics.push(e.metric_name);
                                }
                                const merged = [...this.metricNames];
                                for (const m of savedMetrics) {
                                    if (!merged.includes(m)) merged.push(m);
                                }
                                this.metricNames = merged;

                                const newPlan = {...this._gridPlan};
                                const newFact = {};
                                for (const e of entries) {
                                    const k = this._cellKey(e.metric_name, {year: e.year, month: e.month});
                                    if (e.plan_value != null) newPlan[k] = e.plan_value;
                                    if (e.fact_value != null) newFact[k] = e.fact_value;
                                }
                                this._gridPlan = newPlan;
                                this._gridFact = newFact;
                            }
                        }
                        this.$nextTick(() => this._renderChart());
                    } catch(e) { console.error('loadFact error:', e); }
                    finally { this.factLoading = false; }
                },

                async saveFact() {
                    this.factSaving = true;
                    const payload = [];
                    for (const metric of this.metricNames) {
                        for (const p of this.periods) {
                            const plan = this.getPlan(metric, p);
                            const fact = this.getFact(metric, p);
                            if (plan !== null || fact !== null) {
                                payload.push({year: p.year, month: p.month, metric_name: metric, plan_value: plan, fact_value: fact});
                            }
                        }
                    }
                    if (!payload.length) { this.factSaving = false; return; }
                    try {
                        const res = await authFetch('/api/v1/projects/' + _projectId() + '/fact', {
                            method: 'PUT', body: JSON.stringify(payload),
                        });
                        if (res.ok) {
                            this.factDirty = false;
                        } else {
                            const err = await res.json().catch(() => ({}));
                            alert(err.detail || 'Ошибка сохранения');
                        }
                    } catch(e) { alert('Ошибка сохранения: ' + e.message); }
                    finally { this.factSaving = false; }
                },

                async getAiFactCommentary() {
                    this.factAiLoading = true;
                    try {
                        const res = await authFetch('/api/v1/projects/' + _projectId() + '/fact/ai-commentary', {method:'POST'});
                        if (res.ok) {
                            this.factAiData = await res.json();
                        } else {
                            const err = await res.json().catch(() => ({}));
                            alert(err.detail || 'Ошибка AI');
                        }
                    } catch(e) { alert('Ошибка: ' + e.message); }
                    finally { this.factAiLoading = false; }
                },

                _renderChart() {
                    if (!this.$refs.factChart || typeof Chart === 'undefined') return;
                    if (this._chart) { this._chart.destroy(); this._chart = null; }
                    if (!this.metricNames.length || !this.hasData) return;

                    const M = ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
                    const labels = this.periods.map(p => M[p.month - 1] + '\'' + String(p.year).slice(2));
                    const PALETTE = [
                        {plan:'#5E5CE6', planBg:'rgba(94,92,230,0.07)',  fact:'#34C759', factBg:'rgba(52,199,89,0.09)'},
                        {plan:'#0A84FF', planBg:'rgba(10,132,255,0.07)', fact:'#FF9500', factBg:'rgba(255,149,0,0.09)'},
                        {plan:'#FF2D55', planBg:'rgba(255,45,85,0.07)',  fact:'#5AC8FA', factBg:'rgba(90,200,250,0.09)'},
                        {plan:'#30B0C7', planBg:'rgba(48,176,199,0.07)', fact:'#FF6B35', factBg:'rgba(255,107,53,0.09)'},
                    ];

                    const datasets = [];
                    this.metricNames.forEach((metric, i) => {
                        const c = PALETTE[i % PALETTE.length];
                        const planData = this.periods.map(p => this.getPlan(metric, p));
                        const factData = this.periods.map(p => this.getFact(metric, p));
                        datasets.push({
                            label: metric + ' (план)',
                            data: planData,
                            borderColor: c.plan,
                            backgroundColor: c.planBg,
                            borderDash: [7, 4],
                            borderWidth: 2,
                            fill: true,
                            tension: 0.35,
                            pointRadius: 4,
                            pointHoverRadius: 6,
                            pointBackgroundColor: 'white',
                            pointBorderColor: c.plan,
                            pointBorderWidth: 2,
                            spanGaps: true,
                        });
                        datasets.push({
                            label: metric + ' (факт)',
                            data: factData,
                            borderColor: c.fact,
                            backgroundColor: c.factBg,
                            borderWidth: 2.5,
                            fill: true,
                            tension: 0.35,
                            pointRadius: 5,
                            pointHoverRadius: 7,
                            pointBackgroundColor: 'white',
                            pointBorderColor: c.fact,
                            pointBorderWidth: 2.5,
                            spanGaps: true,
                        });
                    });

                    this._chart = new Chart(this.$refs.factChart, {
                        type: 'line',
                        data: {labels, datasets},
                        options: {
                            responsive: true,
                            interaction: {mode: 'index', intersect: false},
                            plugins: {
                                legend: {
                                    position: 'bottom',
                                    labels: {usePointStyle: true, pointStyle: 'circle', padding: 20, font: {size: 11, family: 'inherit'}, color: '#555'},
                                },
                                tooltip: {
                                    backgroundColor: 'rgba(255,255,255,0.97)',
                                    titleColor: '#1C1C1E',
                                    bodyColor: '#555',
                                    borderColor: '#E5E5ED',
                                    borderWidth: 1,
                                    padding: 12,
                                    boxPadding: 4,
                                    callbacks: {
                                        label: ctx => ` ${ctx.dataset.label}: ${ctx.parsed.y != null ? ctx.parsed.y.toLocaleString('ru-RU') : '—'}`,
                                    },
                                },
                            },
                            scales: {
                                x: {
                                    grid: {color: '#F5F5F8'},
                                    ticks: {font: {size: 10, family: 'inherit'}, color: '#8E8E93', padding: 6, maxRotation: 0},
                                },
                                y: {
                                    beginAtZero: false,
                                    grid: {color: '#F5F5F8'},
                                    ticks: {
                                        font: {size: 11, family: 'inherit'},
                                        color: '#8E8E93',
                                        padding: 8,
                                        callback: v => {
                                            if (v >= 1e9) return (v/1e9).toFixed(1).replace(/\.0$/,'')+'B';
                                            if (v >= 1e6) return (v/1e6).toFixed(1).replace(/\.0$/,'')+'M';
                                            if (v >= 1e3) return (v/1e3).toFixed(1).replace(/\.0$/,'')+'K';
                                            return v;
                                        },
                                    },
                                },
                            },
                        },
                    });
                },
            };
        }
    </script>
