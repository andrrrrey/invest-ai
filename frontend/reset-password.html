<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Восстановление пароля | Инвестиционный процессор</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #E5E5E5; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: white; border-radius: 28px; padding: 48px 40px; width: 100%; max-width: 420px; box-shadow: 0 30px 80px rgba(0,0,0,0.1); }
        .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 36px; }
        .logo-icon { width: 44px; height: 44px; background: #5E5CE6; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; font-size: 20px; }
        .logo-text h2 { font-size: 16px; font-weight: 700; color: #1C1C1E; }
        .logo-text p { font-size: 12px; color: #8E8E93; }
        h1 { font-size: 24px; font-weight: 800; color: #1C1C1E; margin-bottom: 6px; }
        .subtitle { font-size: 14px; color: #8E8E93; margin-bottom: 32px; line-height: 1.5; }
        .field { margin-bottom: 18px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #1C1C1E; margin-bottom: 8px; }
        input { width: 100%; padding: 13px 16px; border: 1.5px solid #E5E5E5; border-radius: 14px; font-size: 14px; font-family: inherit; outline: none; transition: 0.2s; color: #1C1C1E; }
        input:focus { border-color: #5E5CE6; box-shadow: 0 0 0 3px rgba(94, 92, 230, 0.1); }
        .btn { width: 100%; padding: 15px; background: #5E5CE6; color: white; border: none; border-radius: 14px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 8px; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .msg { border-radius: 12px; padding: 12px 16px; font-size: 13px; font-weight: 600; margin-top: 16px; display: none; }
        .msg.visible { display: block; }
        .msg.error { background: #FFE5E5; color: #FF3B30; }
        .msg.success { background: #DDF0E1; color: #2D9B63; }
        .back-link { text-align: center; margin-top: 24px; font-size: 13px; color: #8E8E93; }
        .back-link a { color: #5E5CE6; font-weight: 600; text-decoration: none; }
        .back-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <div class="logo-icon"><i class="fas fa-chart-line"></i></div>
            <div class="logo-text">
                <h2>Инвестиционный процессор</h2>
                <p>Платформа управления проектами</p>
            </div>
        </div>

        <!-- Request form (shown when no token in URL) -->
        <div id="requestState">
            <h1>Восстановить пароль</h1>
            <p class="subtitle">Введите ваш email. Мы отправим ссылку для сброса пароля.</p>
            <form id="requestForm">
                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="your@email.com" required autocomplete="email">
                </div>
                <button type="submit" class="btn" id="requestBtn">
                    <i class="fas fa-envelope"></i>
                    <span id="requestBtnText">Отправить ссылку</span>
                </button>
                <div class="msg error" id="requestError"></div>
                <div class="msg success" id="requestSuccess"></div>
            </form>
            <div class="back-link">
                <a href="/login.html">← Вернуться ко входу</a>
            </div>
        </div>

        <!-- New password form (shown when token is in URL) -->
        <div id="resetState" style="display:none">
            <h1>Новый пароль</h1>
            <p class="subtitle">Придумайте новый пароль для вашего аккаунта.</p>
            <form id="resetForm">
                <div class="field">
                    <label for="newPassword">Новый пароль</label>
                    <input type="password" id="newPassword" placeholder="Минимум 6 символов" required autocomplete="new-password" minlength="6">
                </div>
                <div class="field">
                    <label for="confirmPassword">Подтвердите пароль</label>
                    <input type="password" id="confirmPassword" placeholder="Повторите пароль" required autocomplete="new-password">
                </div>
                <button type="submit" class="btn" id="resetBtn">
                    <i class="fas fa-lock"></i>
                    <span id="resetBtnText">Установить пароль</span>
                </button>
                <div class="msg error" id="resetError"></div>
            </form>
        </div>

        <!-- Success state after reset -->
        <div id="successState" style="display:none; text-align:center">
            <div style="width:64px;height:64px;background:#DDF0E1;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:28px;color:#2D9B63">
                <i class="fas fa-check"></i>
            </div>
            <h2 style="font-size:20px;font-weight:800;color:#1C1C1E;margin-bottom:10px">Пароль изменён!</h2>
            <p style="font-size:14px;color:#8E8E93;margin-bottom:24px">Войдите в систему с новым паролем.</p>
            <a href="/login.html" style="display:inline-block;background:#5E5CE6;color:white;padding:13px 32px;border-radius:14px;font-size:14px;font-weight:700;text-decoration:none">
                Войти
            </a>
        </div>
    </div>

    <script>
        const token = new URLSearchParams(location.search).get('token');

        if (token) {
            document.getElementById('requestState').style.display = 'none';
            document.getElementById('resetState').style.display = 'block';
        }

        // Request reset form
        document.getElementById('requestForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const btn = document.getElementById('requestBtn');
            const btnText = document.getElementById('requestBtnText');
            const errEl = document.getElementById('requestError');
            const succEl = document.getElementById('requestSuccess');

            btn.disabled = true;
            btnText.textContent = 'Отправляем...';
            errEl.classList.remove('visible');
            succEl.classList.remove('visible');

            try {
                const res = await fetch('/api/v1/auth/forgot-password', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({email}),
                });
                const data = await res.json();
                if (res.ok) {
                    succEl.textContent = data.detail;
                    succEl.classList.add('visible');
                } else {
                    errEl.textContent = data.detail || 'Ошибка';
                    errEl.classList.add('visible');
                }
            } catch(err) {
                errEl.textContent = 'Ошибка соединения с сервером';
                errEl.classList.add('visible');
            } finally {
                btn.disabled = false;
                btnText.textContent = 'Отправить ссылку';
            }
        });

        // Reset password form
        document.getElementById('resetForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const btn = document.getElementById('resetBtn');
            const btnText = document.getElementById('resetBtnText');
            const errEl = document.getElementById('resetError');

            if (newPassword !== confirmPassword) {
                errEl.textContent = 'Пароли не совпадают';
                errEl.classList.add('visible');
                return;
            }

            btn.disabled = true;
            btnText.textContent = 'Сохраняем...';
            errEl.classList.remove('visible');

            try {
                const res = await fetch('/api/v1/auth/reset-password', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({token, new_password: newPassword}),
                });
                const data = await res.json();
                if (res.ok) {
                    document.getElementById('resetState').style.display = 'none';
                    document.getElementById('successState').style.display = 'block';
                } else {
                    errEl.textContent = data.detail || 'Ошибка';
                    errEl.classList.add('visible');
                }
            } catch(err) {
                errEl.textContent = 'Ошибка соединения с сервером';
                errEl.classList.add('visible');
            } finally {
                btn.disabled = false;
                btnText.textContent = 'Установить пароль';
            }
        });
    </script>
</body>
</html>
